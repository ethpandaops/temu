name: Build and Push Docker Images

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      teku_ref:
        description: 'consensys/teku branch or tag to build (needs patches/consensys/teku/<ref>.patch). Refs other than master get <ref>-<sha7> tags and never touch latest.'
        required: false
        default: master
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: ethpandaops/temu
  TEKU_REF: ${{ inputs.teku_ref || 'master' }}

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare patched source
        run: |
          if [[ ! "$TEKU_REF" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid teku_ref: $TEKU_REF" >&2
            exit 1
          fi
          ./scripts/temu-build.sh -r "consensys/teku" -b "$TEKU_REF" --skip-build --ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "$TEKU_REF" == "master" ]; then
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            echo "tag=${TEKU_REF}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image via Gradle
        run: |
          cd teku
          ./gradlew distDocker

      - name: Tag and push amd64 image
        run: |
          docker tag consensys/teku:develop ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare patched source
        run: |
          if [[ ! "$TEKU_REF" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid teku_ref: $TEKU_REF" >&2
            exit 1
          fi
          ./scripts/temu-build.sh -r "consensys/teku" -b "$TEKU_REF" --skip-build --ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "$TEKU_REF" == "master" ]; then
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            echo "tag=${TEKU_REF}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image via Gradle
        run: |
          cd teku
          ./gradlew distDocker

      - name: Tag and push arm64 image
        run: |
          docker tag consensys/teku:develop ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
        run: |
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64"

          # Create version-specific manifest
          echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${AMD64_IMAGE} ${ARM64_IMAGE}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          # latest only tracks teku master builds from releases and master pushes
          if [ "$TEKU_REF" == "master" ] && { [ "${{ github.event_name }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; }; then
            echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              ${AMD64_IMAGE} ${ARM64_IMAGE}
            docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          fi

      - name: Summary
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Teku ref:** \`${TEKU_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$TEKU_REF" == "master" ] && { [ "${{ github.event_name }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; }; then
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          fi
