name: Integration Test

on:
  pull_request:
    paths:
      - 'patches/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'kurtosis-config.yaml'
  push:
    branches:
      - master
    paths:
      - 'patches/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'kurtosis-config.yaml'
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Kurtosis
        env:
          KURTOSIS_VERSION: "1.20.0"
        run: |
          curl -fsSL "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kurtosis
          kurtosis version

      - name: Prepare patched source
        run: |
          ./scripts/temu-build.sh -r "consensys/teku" -b "master" --skip-build --ci

      - name: Build Docker image
        run: |
          cd teku
          ./gradlew distDocker

      - name: Run integration test
        run: |
          ./scripts/integration-test.sh
