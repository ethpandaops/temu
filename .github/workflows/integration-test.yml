name: Integration Test

on:
  pull_request:
    paths:
      - 'patches/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'kurtosis-config.yaml'
  push:
    branches:
      - master
    paths:
      - 'patches/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'kurtosis-config.yaml'
  workflow_dispatch:

jobs:
  discover-refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@v4

      - name: List teku refs with a patch
        id: refs
        run: |
          refs=$(find patches/consensys/teku -name '*.patch' -type f | sed 's|^patches/consensys/teku/||; s|\.patch$||' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "Teku refs: $refs"
          echo "refs=$refs" >> $GITHUB_OUTPUT

  integration-test:
    needs: discover-refs
    name: integration-test (${{ matrix.teku_ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        teku_ref: ${{ fromJson(needs.discover-refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Kurtosis
        env:
          KURTOSIS_VERSION: "1.20.0"
        run: |
          curl -fsSL "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kurtosis
          kurtosis version

      - name: Prepare patched source
        run: |
          ./scripts/temu-build.sh -r "consensys/teku" -b "${{ matrix.teku_ref }}" --skip-build --ci

      - name: Build Docker image
        run: |
          cd teku
          ./gradlew distDocker

      - name: Run integration test
        run: |
          ./scripts/integration-test.sh
